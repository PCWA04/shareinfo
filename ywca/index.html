<style>
:root{
  --cream:#FFF4E3;
  --cream-deep:#F5E6CC;
  --milk:#E8C9A0;
  --tea:#A8754A;
  --tea-deep:#6B4226;
  --boba:#2C1810;
  --ink:#1F1410;
  --pink:#F4A5A5;
  --leader:#E63946;
  --reformer:#5B4B8A;
  --funner:#F4A261;
  --advocate:#2A9D8F;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  min-height:100%;
  background:var(--cream);
  font-family:'Fraunces','LXGW WenKai TC','Noto Serif TC',serif;
  color:var(--ink);
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(circle at 12% 18%, var(--boba) 6px, transparent 7px),
    radial-gradient(circle at 88% 22%, var(--boba) 4px, transparent 5px),
    radial-gradient(circle at 25% 75%, var(--boba) 5px, transparent 6px),
    radial-gradient(circle at 70% 85%, var(--boba) 7px, transparent 8px),
    radial-gradient(circle at 50% 45%, var(--tea) 3px, transparent 4px),
    radial-gradient(circle at 92% 60%, var(--tea) 4px, transparent 5px),
    radial-gradient(circle at 8% 50%, var(--tea) 3px, transparent 4px);
  opacity:.12;
  pointer-events:none;
  z-index:0;
}

.app{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:32px 20px 60px;
}

.lang-toggle{
  position:fixed;
  top:20px;
  left:20px;
  z-index:50;
  display:flex;
  background:white;
  border:2.5px solid var(--tea-deep);
  border-radius:50px;
  padding:4px;
  box-shadow:4px 4px 0 var(--milk);
  font-family:'Fraunces','Noto Serif TC',serif;
  font-weight:700;
}
.lang-btn{
  background:transparent;
  border:none;
  padding:8px 16px;
  font-size:15px;
  font-family:inherit;
  font-weight:700;
  color:var(--tea-deep);
  cursor:pointer;
  border-radius:40px;
  transition:all .2s;
}
.lang-btn.active{
  background:var(--tea-deep);
  color:var(--cream);
}
.lang-btn:hover:not(.active){
  background:var(--cream-deep);
}

.ywca-logo{
  position:fixed;
  top:18px;
  right:20px;
  z-index:50;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 12px;
  background:rgba(255,255,255,.9);
  border:2px solid rgba(107,66,38,.18);
  border-radius:12px;
  box-shadow:4px 4px 0 rgba(232,201,160,.85);
}
.ywca-logo svg{
  width:78px;
  height:auto;
  display:block;
}
.ywca-logo-text{
  font-family:Arial,'Noto Serif TC',sans-serif;
  font-size:15px;
  line-height:1.15;
  font-weight:700;
  color:#5f5a54;
  white-space:nowrap;
  letter-spacing:.01em;
}
.ywca-logo-text span{
  display:block;
  font-size:12px;
  margin-top:4px;
  letter-spacing:.04em;
}
@media (max-width:640px){
  .app{padding-top:112px;}
  .ywca-logo{
    top:64px;
    left:20px;
    right:auto;
  }
  .ywca-logo svg{width:58px;}
  .ywca-logo-text{font-size:12px;}
  .ywca-logo-text span{font-size:9px;}
}

.screen{display:none; width:100%; max-width:760px;}
.screen.active{display:block; animation:fadeUp .55s ease-out;}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}

.hero{
  text-align:center;
  padding:30px 0 16px;
  position:relative;
}

.hero .kicker{
  display:inline-block;
  font-family:'Caveat',cursive;
  font-size:28px;
  color:var(--tea);
  transform:rotate(-3deg);
  background:var(--cream-deep);
  padding:6px 18px;
  border-radius:30px;
  border:2px dashed var(--tea);
  margin-bottom:18px;
}

.hero h1{
  font-family:'Fraunces','Noto Serif TC',serif;
  font-weight:900;
  font-size:clamp(36px,6.5vw,60px);
  line-height:1.1;
  letter-spacing:-.005em;
  color:var(--tea-deep);
  margin-bottom:14px;
}

.hero h1 .accent{
  color:var(--leader);
  position:relative;
  display:inline-block;
}
.hero h1 .accent::after{
  content:"";
  position:absolute;
  left:-4px;right:-4px;bottom:6px;
  height:14px;
  background:var(--pink);
  z-index:-1;
  border-radius:8px;
  opacity:.55;
}

.hero p.lead{
  font-size:18px;
  color:var(--tea-deep);
  max-width:540px;
  margin:0 auto 28px;
  line-height:1.7;
}

.hero-cup{
  width:200px;
  height:240px;
  margin:0 auto 24px;
  position:relative;
  animation:wobble 4s ease-in-out infinite;
}
@keyframes wobble{
  0%,100%{transform:rotate(-2deg);}
  50%{transform:rotate(2deg);}
}

.btn-primary{
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:var(--tea-deep);
  color:var(--cream);
  font-family:'Fraunces','Noto Serif TC',serif;
  font-weight:700;
  font-size:20px;
  padding:18px 42px;
  border:none;
  border-radius:50px;
  cursor:pointer;
  box-shadow:0 6px 0 var(--boba),0 10px 24px rgba(44,24,16,.25);
  transition:transform .15s, box-shadow .15s;
  letter-spacing:.02em;
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 0 var(--boba),0 12px 30px rgba(44,24,16,.3);
}
.btn-primary:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 var(--boba),0 4px 10px rgba(44,24,16,.2);
}

.tags{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:24px;
}
.tag{
  font-size:14px;
  background:white;
  border:1.5px solid var(--milk);
  color:var(--tea-deep);
  padding:6px 14px;
  border-radius:20px;
  font-family:'Fraunces','LXGW WenKai TC',sans-serif;
  font-weight:500;
}

.q-stage{
  display:grid;
  grid-template-columns:240px 1fr;
  gap:36px;
  align-items:start;
  margin-top:20px;
}
@media (max-width:720px){
  .q-stage{grid-template-columns:1fr; gap:20px;}
  .cup-aside{margin:0 auto; max-width:200px;}
}

.cup-aside{
  position:sticky;
  top:24px;
  text-align:center;
}
.cup-svg{width:100%; height:auto; max-width:220px;}

.progress-text{
  font-family:'Caveat',cursive;
  font-size:26px;
  color:var(--tea-deep);
  margin-top:10px;
}

.pearls-row{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:8px;
}
.pearl-dot{
  width:14px;height:14px;border-radius:50%;
  background:var(--cream-deep);
  border:2px solid var(--milk);
  transition:all .3s;
}
.pearl-dot.done{
  background:var(--boba);
  border-color:var(--boba);
  transform:scale(1.15);
}

.q-card{
  background:white;
  border-radius:24px;
  padding:32px 28px;
  border:3px solid var(--tea-deep);
  box-shadow:8px 8px 0 var(--milk);
  position:relative;
}
.q-card::before{
  content:attr(data-num);

  top:-22px; left:24px;
  background:var(--leader);
  color:white;
  font-family:'Caveat',cursive;
  font-size:24px;
  padding:6px 18px;
  border-radius:20px;
  border:3px solid var(--tea-deep);
  font-weight:700;
}

.q-title{
  font-family:'Fraunces','Noto Serif TC',serif;
  font-weight:700;
  font-size:24px;
  color:var(--tea-deep);
  margin-bottom:6px;
  line-height:1.3;
}
.q-sub{
  font-size:15px;
  color:var(--tea);
  margin-bottom:22px;
  font-style:italic;
}

.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.opt{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--cream);
  border:2px solid var(--milk);
  border-radius:16px;
  padding:14px 18px;
  font-family:'Fraunces','LXGW WenKai TC',sans-serif;
  font-size:16px;
  color:var(--ink);
  text-align:left;
  cursor:pointer;
  transition:all .2s;
  width:100%;
  line-height:1.4;
}
.opt:hover{
  background:white;
  border-color:var(--tea);
  transform:translateX(4px);
}
.opt .emoji{
  font-size:28px;
  flex-shrink:0;
}
.opt .label{
  flex:1;
  font-weight:500;
}
.opt .arrow{
  opacity:0;
  font-size:22px;
  color:var(--tea);
  transition:opacity .2s, transform .2s;
}
.opt:hover .arrow{
  opacity:1;
  transform:translateX(2px);
}

.result-wrap{
  text-align:center;
  padding-top:20px;
}

.share-capture{
  background:var(--cream);
  border-radius:32px;
  padding:22px 18px 26px;
  margin-bottom:24px;
}
.share-capture .result-card{
  margin-bottom:0;
}
.share-signature{
  margin-top:16px;
  font-family:'Caveat','LXGW WenKai TC',cursive;
  font-size:20px;
  color:var(--tea-deep);
  text-align:center;
}
.result-kicker{
  font-family:'Caveat',cursive;
  font-size:26px;
  color:var(--tea);
  margin-bottom:8px;
}
.result-name{
  font-family:'Fraunces','Noto Serif TC',serif;
  font-weight:900;
  font-size:clamp(38px,7vw,64px);
  line-height:1.05;
  margin-bottom:8px;
  letter-spacing:-.01em;
}
.result-tagline{
  font-size:19px;
  color:var(--tea-deep);
  margin-bottom:24px;
  font-style:italic;
  font-family:'Fraunces','Noto Serif TC',serif;
}

.result-card{
  background:white;
  border:3px solid var(--tea-deep);
  border-radius:28px;
  padding:32px 28px;
  box-shadow:10px 10px 0 var(--milk);
  text-align:left;
  margin-bottom:24px;
}

.result-grid{
  display:grid;
  grid-template-columns:200px 1fr;
  gap:28px;
  align-items:start;
}
@media (max-width:600px){
  .result-grid{grid-template-columns:1fr; text-align:center;}
  .result-grid .cup-result{margin:0 auto;}
}

.cup-result{width:200px;height:240px;position:relative;}

.result-section{margin-bottom:18px;}
.result-section h3{
  font-family:'Fraunces','Noto Serif TC',serif;
  font-weight:700;
  font-size:17px;
  color:var(--ink);
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.result-section h3::before{
  content:"";
  width:18px;height:18px;
  background:var(--leader);
  border-radius:50%;
  display:inline-block;
}
.result-section p{
  font-size:16px;
  line-height:1.75;
  color:var(--ink);
}

.recipe-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:6px;
}
.recipe-chip{
  background:var(--cream-deep);
  border:1.5px solid var(--milk);
  padding:6px 14px;
  border-radius:20px;
  font-size:14px;
  color:var(--tea-deep);
  font-weight:500;
}

.partners{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:8px;
}
@media (max-width:480px){.partners{grid-template-columns:1fr;}}
.partner{
  background:var(--cream);
  border:2px solid var(--milk);
  border-radius:14px;

}
.partner b{display:block; color:var(--tea-deep); margin-bottom:2px; font-weight:700;}

.share-row{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}

.btn-secondary{
  background:transparent;
  color:var(--tea-deep);
  border:2.5px solid var(--tea-deep);
  font-family:'Fraunces','Noto Serif TC',serif;
  font-weight:700;
  font-size:17px;
  padding:14px 28px;
  border-radius:50px;
  cursor:pointer;
  transition:all .2s;
}
.btn-secondary:hover{
  background:var(--tea-deep);
  color:var(--cream);
}

.btn-share-trigger{
  background:var(--leader);

.btn-facebook{

  box-shadow:0 8px 0 #0D3B78,0 12px 30px rgba(24,119,242,.28);

  box-shadow:0 8px 0 #6B1D49,0 12px 30px rgba(193,53,132,.28);

.btn-line{
  background:#06C755;
  box-shadow:0 6px 0 #047A36,0 10px 24px rgba(6,199,85,.22);

.btn-line:hover{
  box-shadow:0 8px 0 #047A36,0 12px 30px rgba(6,199,85,.28);
}
.btn-x{

.btn-x:hover{
  box-shadow:0 8px 0 #000,0 12px 30px rgba(0,0,0,.28);
}
.btn-threads{
  background:#4D4D4D;
  box-shadow:0 6px 0 #222,0 10px 24px rgba(0,0,0,.18);
}
.btn-threads:hover{
  box-shadow:0 8px 0 #222,0 12px 30px rgba(0,0,0,.24);
}
.share-row .btn-primary,
.share-row .btn-secondary{
  min-width:190px;
  justify-content:center;
}
.share-row-compact{
  max-width:980px;
  margin:0 auto;
}
.share-row-compact .btn-primary,
.share-row-compact .btn-secondary{
  min-width:min(280px,100%);
}
@media (max-width:640px){
  .share-row-compact{
    flex-direction:column;
    align-items:stretch;
  }
  .share-row-compact .btn-primary,
  .share-row-compact .btn-secondary{
    width:100%;
  }
}

.share-modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(31,20,16,.42);
}
.share-modal.active{display:flex;}
.share-dialog{
  width:min(440px,100%);
  background:white;
  border:3px solid var(--tea-deep);
  border-radius:24px;
  box-shadow:10px 10px 0 var(--milk);
  padding:24px;
  text-align:center;
}
.share-dialog h3{
  font-size:24px;
  color:var(--tea-deep);
  margin-bottom:16px;
}
.share-options{
  display:grid;
  gap:12px;
}
.share-option{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
.share-close{
  margin-top:14px;
  padding:10px 18px;
  font-size:15px;
}

.float-bubble{
  position:fixed;
  border-radius:50%;
  background:var(--boba);
  pointer-events:none;
  z-index:0;
  animation:floatUp 3s ease-out forwards;
}
@keyframes floatUp{
  0%{transform:translateY(0) scale(0); opacity:0;}
  20%{opacity:.7; transform:translateY(-30px) scale(1);}
  100%{transform:translateY(-100vh) scale(.8); opacity:0;}
}

.confetti{
  position:fixed;
  width:12px;height:12px;
  border-radius:50%;
  pointer-events:none;
  z-index:5;
}

.footer-note{
  text-align:center;
  font-size:13px;
  color:var(--tea);
  margin-top:24px;
  font-family:'Caveat',cursive;
  letter-spacing:.05em;
}

function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = (lang === 'zh') ? 'zh-Hant' : 'en';
  document.title = T[lang].docTitle;
  document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  applyStaticText();
  if(document.getElementById('screen-quiz').classList.contains('active')){
    renderQuestion(true);
  }
  if(document.getElementById('screen-result').classList.contains('active') && resultRoleKey){
    renderResult(resultRoleKey);
  }
}

function applyStaticText(){
  const t = T[currentLang];
  document.getElementById('t-kicker').textContent = t.kicker;
  document.getElementById('t-title').innerHTML = t.title;
  document.getElementById('t-lead').innerHTML = t.lead;
  document.getElementById('t-start-btn').textContent = t.startBtn;
  document.getElementById('t-tags').innerHTML = t.tags.map(x => `<span class="tag">${x}</span>`).join('');

  document.getElementById('share-title').textContent = t.shareChoose;

  document.getElementById('t-share-ig-btn').textContent = t.shareIgBtn;

  document.getElementById('t-footer').textContent = t.footer;
}

function isAnalyticsEnabled(){
  return window.GA_MEASUREMENT_ID && window.GA_MEASUREMENT_ID !== 'G-XXXXXXXXXX' && typeof gtag === 'function';
}

function trackEvent(eventName, params = {}){
  if(!isAnalyticsEnabled()) return;

  try{
    gtag('event', eventName, {
      language: currentLang,
      ...params
    });
  }catch(err){
    console.warn('Analytics event failed:', eventName, err);
  }
}

function getScoreSummary(){
  return {
    leader_score: scores[0],
    reformer_score: scores[1],
    funner_score: scores[2],
    advocate_score: scores[3]
  };
}

function startQuiz(){
  trackEvent('start_quiz');
  document.getElementById('screen-start').classList.remove('active');
  document.getElementById('screen-quiz').classList.add('active');
  currentQ = 0;
  scores = [0,0,0,0];
  selectedAnswers = [];
  buildPearls();
  renderQuestion();
  spawnFloatBubbles(8);
}

function buildPearls(){
  const row = document.getElementById('pearls-row');
  row.innerHTML = '';
  for(let i = 0; i < QUESTIONS.length; i++){
    const d = document.createElement('div');
    d.className = 'pearl-dot';
    row.appendChild(d);
  }
}

function renderQuestion(silent){
  const q = QUESTIONS[currentQ][currentLang];
  const card = document.getElementById('q-card');
  card.setAttribute('data-num', 'Q' + (currentQ + 1));
  document.getElementById('q-title').textContent = q.title;
  document.getElementById('q-sub').textContent = q.sub;
  document.getElementById('q-current').textContent = currentQ + 1;

  document.querySelectorAll('.pearl-dot').forEach((d, i) => {
    d.classList.toggle('done', i < currentQ);
  });

  const fillY = 230 - ((currentQ) / QUESTIONS.length) * 160;
  document.getElementById('tea-fill').setAttribute('y', fillY);

  if(currentQ > 0){
    addBobaToProgressCup(currentQ);
  } else {
    document.getElementById('bobas-group').innerHTML = '';
  }

  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `
      <span class="emoji">${opt.emoji}</span>
      <span class="label">${opt.label}</span>
      <span class="arrow">→</span>
    `;
    btn.onclick = () => selectOption(idx);
    optsEl.appendChild(btn);
  });

  if(!silent){
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'fadeUp .45s ease-out';
  }
}

function addBobaToProgressCup(idx){
  const positions = [
    [75, 215], [100, 218], [125, 213],
    [85, 200], [115, 200], [70, 190],
    [105, 185], [130, 195]
  ];
  const group = document.getElementById('bobas-group');
  group.innerHTML = '';
  for(let i = 0; i < idx + 1 && i < positions.length; i++){
    const [cx, cy] = positions[i];
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', cx);
    c.setAttribute('cy', cy);
    c.setAttribute('r', 8);
    c.setAttribute('fill', '#2C1810');
    c.style.opacity = '0';
    c.style.animation = `fadeIn .5s ease-out ${i*.05}s forwards`;
    group.appendChild(c);
  }
  if(!document.getElementById('boba-anim')){
    const style = document.createElement('style');
    style.id = 'boba-anim';
    style.textContent = '@keyframes fadeIn{to{opacity:1;}}';
    document.head.appendChild(style);
  }
}

function selectOption(idx){
  const questionNumber = currentQ + 1;
  const optionLabel = QUESTIONS[currentQ][currentLang].options[idx].label;
  selectedAnswers[currentQ] = idx;
  trackEvent('answer_question', {
    question_number: questionNumber,
    selected_option_index: idx + 1,
    selected_option_label: optionLabel
  });
  const scoreVec = QUESTIONS[currentQ].scores[idx];
  scoreVec.forEach((s, i) => scores[i] += s);
  spawnFloatBubbles(5);
  currentQ++;
  if(currentQ >= QUESTIONS.length){
    setTimeout(showResult, 400);
  } else {
    setTimeout(() => renderQuestion(), 250);
  }
}

function showResult(){
  document.getElementById('tea-fill').setAttribute('y', 70);
  addBobaToProgressCup(QUESTIONS.length);
  document.querySelectorAll('.pearl-dot').forEach(d => d.classList.add('done'));

  let maxIdx = 0;
  scores.forEach((s, i) => { if(s > scores[maxIdx]) maxIdx = i; });
  resultRoleKey = ROLE_KEYS[maxIdx];

  trackEvent('complete_quiz', {
    result_role: resultRoleKey,
    result_role_name: ROLES[resultRoleKey][currentLang].name,
    recipe: getResultRecipe(resultRoleKey).join(' / '),
    ...getScoreSummary()
  });

  renderResult(resultRoleKey);

  document.getElementById('screen-quiz').classList.remove('active');
  document.getElementById('screen-result').classList.add('active');

  spawnConfetti(ROLES[resultRoleKey].color);
}

    return ROLES[roleKey][currentLang].recipe;

  return [
    labels.tea[selectedAnswers[3]],
    labels.sweetness[selectedAnswers[0]],
    labels.ice[selectedAnswers[2]],
    labels.pearls[selectedAnswers[1]]
  ];
}

  const url = new URL(SHARE_URL);
  url.searchParams.set('role', resultRoleKey);
  url.searchParams.set('lang', currentLang);
  return url.toString();
}

function getSharePayload(){
  const role = ROLES[resultRoleKey];
  const name = role ? role[currentLang].name : T[currentLang].docTitle;
  const text = T[currentLang].shareText(name);

  const resultUrl = getResultShareUrl();
  return {
    title: T[currentLang].docTitle,
    text,
    url,
    resultUrl,
    clipboardText: `${text} ${url}`
  };
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, (m) => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[m]));
}

async function createResultImageBlob(){
  if(!window.html2canvas){
    throw new Error('html2canvas is not loaded');
  }

  const target = buildShareImageCard();
  await document.fonts?.ready;

  const canvas = await html2canvas(target, {
    backgroundColor: '#FFF4E3',
    scale: 2,
    width: 1080,
    height: 1440,
    windowWidth: 1200,
    windowHeight: 1500,
    useCORS: true,
    allowTaint: false,
    logging: false,
    scrollX: 0,
    scrollY: 0
  });

  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => {
      if(blob){
        resolve(blob);
      }else{
        reject(new Error('Canvas toBlob failed'));
      }
    }, 'image/png', 1);
  });
}

function downloadBlob(blob, fileName){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function safeCopyText(text){
  if(!navigator.clipboard){
    return false;
  }
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(err){
    return false;
  }
}

async function shareResultImage(){
  if(!resultRoleKey){
    return;
  }

  trackEvent('generate_share_image', {
    result_role: resultRoleKey,
    result_role_name: ROLES[resultRoleKey][currentLang].name
  });

  const btn = document.getElementById('t-share-image-btn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = T[currentLang].preparingImage;

  try{
    const payload = getSharePayload();
    const roleName = ROLES[resultRoleKey][currentLang].name.replace(/[\\/:*?"<>|\s]+/g, '-');
    const fileName = `ywca-boba-${resultRoleKey}-${currentLang}.png`;
    const blob = await createResultImageBlob();
    const file = new File([blob], fileName, { type: 'image/png' });

    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({
        title: payload.title,
        text: payload.text,
        url: payload.url,
        files: [file]
      });
      trackEvent('share_result_image', {
        result_role: resultRoleKey,
        share_method: 'native_share'
      });
    }else{
      downloadBlob(blob, fileName);
      await safeCopyText(payload.clipboardText);
      trackEvent('download_result_image', {
        result_role: resultRoleKey,
        share_method: 'download_fallback'
      });
      alert(T[currentLang].imageFallbackAlert);
    }
  }catch(err){
    console.error(err);
    alert(T[currentLang].imageErrorAlert);
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function spawnFloatBubbles(n){
  for(let i = 0; i < n; i++){
    const b = document.createElement('div');
    b.className = 'float-bubble';
    const size = 8 + Math.random() * 14;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = (Math.random() * 100) + 'vw';
    b.style.bottom = '-30px';
    b.style.animationDelay = (Math.random() * .5) + 's';
    b.style.opacity = .3 + Math.random() * .4;
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 3500);
  }
}

function spawnConfetti(color){
  const colors = [color, '#F4A5A5', '#E8C9A0', '#2C1810', '#A8754A'];
  for(let i = 0; i < 40; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[i % colors.length];
    c.style.left = (Math.random() * 100) + 'vw';
    c.style.top = '-20px';
    const size = 8 + Math.random() * 10;
    c.style.width = size + 'px';
    c.style.height = size + 'px';
    document.body.appendChild(c);
    const duration = 2 + Math.random() * 1.5;
    c.animate([
      { transform:'translateY(0) rotate(0deg)', opacity:1 },
      { transform:`translateY(110vh) rotate(${360+Math.random()*360}deg)`, opacity:.3 }
    ], { duration: duration * 1000, easing:'cubic-bezier(.3,.7,.5,1)' });
    setTimeout(() => c.remove(), duration * 1000);
  }
}

function initFromSharedUrl(){
  const params = new URLSearchParams(window.location.search);
  const lang = params.get('lang');
  const role = params.get('role');

  if(lang === 'zh' || lang === 'en'){
    setLang(lang);
  }

  if(role && ROLES[role]){
    resultRoleKey = role;
    trackEvent('view_shared_result', {
      result_role: role,
      result_role_name: ROLES[role][currentLang].name
    });
    renderResult(role);
    document.getElementById('screen-start').classList.remove('active');
    document.getElementById('screen-quiz').classList.remove('active');
    document.getElementById('screen-result').classList.add('active');
  }
}
